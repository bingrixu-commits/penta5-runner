<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>命中率看板 · 独立只读</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#121a2b; --ink:#f1f5f9; --muted:#94a3b8;
      --line:#243044; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --accent:#38bdf8;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:
      radial-gradient(900px 360px at 12% 0%,rgba(56,189,248,.12),transparent 55%),
      radial-gradient(700px 280px at 100% 8%,rgba(251,191,36,.08),transparent 50%),
      var(--bg);color:var(--ink);font-family:"IBM Plex Sans","PingFang SC","Microsoft YaHei",sans-serif}
    body{padding:18px 14px 40px}
    .wrap{max-width:1100px;margin:0 auto}
    .head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
    h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.04em}
    .sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.5}
    .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    a.link,button.btn{
      appearance:none;border:1px solid var(--line);background:#182235;color:#e2e8f0;
      border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;
    }
    button.btn.primary{background:#0ea5e9;border-color:#0284c7;color:#082f49}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;color:#cbd5e1}
    .chip.ok{color:var(--ok);border-color:rgba(52,211,153,.35)}
    .chip.bad{color:var(--bad);border-color:rgba(248,113,113,.35)}
    .chip.warn{color:var(--warn);border-color:rgba(251,191,36,.35)}
    section{margin:0 0 16px;background:rgba(18,26,43,.92);border:1px solid var(--line);border-radius:14px;overflow:hidden}
    section h2{margin:0;padding:12px 14px;font-size:14px;font-weight:800;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
    section .note{padding:0 14px 10px;color:var(--muted);font-size:12px;line-height:1.5}
    .day-bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
    .day-bar label{font-size:12px;font-weight:700;color:var(--muted)}
    .day-bar select{
      height:34px;border:1px solid var(--line);border-radius:8px;background:#0b1220;color:var(--ink);
      padding:0 10px;font-size:13px;font-weight:700;
    }
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
    th{color:#94a3b8;font-weight:700;font-size:12px}
    td.rate{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
    td.rate.ok{color:var(--ok)}
    td.rate.warn{color:var(--warn)}
    td.rate.bad{color:var(--bad)}
    td.muted{color:var(--muted)}
    .status{margin-top:8px;padding:10px 12px;border-radius:10px;background:#182235;color:#cbd5e1;font-size:13px;line-height:1.5}
    .status.err{background:rgba(220,38,38,.16);color:#fecaca}
    .empty{padding:16px;color:var(--muted)}
    .scroll{overflow:auto}
    @media (max-width:640px){
      th.hide-sm,td.hide-sm{display:none}
      h1{font-size:18px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>命中率看板</h1>
        <div class="sub">独立只读 · <code>/state</code> + 按日百分比账本 · 不改算法</div>
      </div>
      <div class="actions">
        <a class="link" href="/panel">返回面板</a>
        <button class="btn" id="exportBtn" type="button">导出按日账</button>
        <button class="btn primary" id="refreshBtn" type="button">刷新</button>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <div id="status" class="status">加载中…</div>
    <div id="sections"></div>
    <div id="pageFooter" class="note">历史日账仅存本浏览器 localStorage，服务端只提供当日投影。</div>
  </div>
  <script>
(function(){
  var AUTO_MS = 60000;
  var DIARY_KEY = "penta5_accuracy_daily_v1";
  var DIARY_KEEP_DAYS = 60;
  var selectedDay = "";
  var explicitHistoryDay = false;
  var displayedBusinessDay = "";
  var lastState = null;
  var timer = null;

  var MODEL_LABELS = {
    autoTop6: "自动Top6",
    recommend2: "推荐2",
    killFramework: "杀框",
    fourDingFramework: "四定框架",
    threeDuishu: "三对数",
    sixPeiSix: "六配六",
    fivePeiFive: "五配五四定",
    twoDigitAvoidAllThree: "对数避开(三组)"
  };

  // 页面内基线：优先 /state rateDetails[key].randomBaseline；下表为 10^4 精确枚举/理论校正值。
  // 审计依据：D-classic-models 报告（2026-10-31），累计 2999 期。
  var EXACT_BASELINES = {
    "position.wan.main": 90, "position.qian.main": 90, "position.bai.main": 90, "position.shi.main": 90,
    "wan": 80, "qian": 80, "bai": 80, "shi": 80,
    "positionTotal": 40.96, "threeDuishu": 90.26, "sixPeiSix": 93.76, "fivePeiFive": 87.02,
    "totalHewei": 90, "threeFour": 72.90,
    "wanQianBai": 90, "qianBaiShi": 90, "wanQianBaiShi": 90,
    "sumAvoid": 96.28, "sumRangeAvoid": 99.82, "spanAvoid": 99.89, "repeatAvoid": 99.90,
    "consecutiveAvoid": 98.32, "parityRatioAvoid": 93.75, "sizeRatioAvoid": 93.75,
    "threeDigitAvoid": 97.96, "threeDigitAvoid2": 97.96, "threeDigitHit": 97.96,
    "twoDigitAvoid": 90.26, "twoDigitAvoid2": 90.26, "twoDigitAvoid3": 90.26,
    "twoDigitHit": 90.26, "anyTwoHeweiHit": 98.08, "anyThreeHeweiHit": 93.75
  };
  // 接口 rateDetails.randomBaseline 原值（与精确值不同的项，供 * 脚注）
  var IFACE_BASELINE_ORIGINAL = {
    "sumAvoid": 97, "sumRangeAvoid": 99, "spanAvoid": 99.5, "repeatAvoid": 99.5,
    "consecutiveAvoid": 99.5, "parityRatioAvoid": 93, "sizeRatioAvoid": 93,
    "twoDigitHit": 90, "anyTwoHeweiHit": 99, "anyThreeHeweiHit": 97
  };
  // 中性球序标签：平台官方球序 万/千/百/十/个（第5球不参与本模型）
  var POSITION_LABELS = {
    "position.wan.main": "第1位单定（平台万位）",
    "position.qian.main": "第2位单定（平台千位）",
    "position.bai.main": "第3位单定（平台百位）",
    "position.shi.main": "第4位单定（平台十位）",
    "wan": "第1位双码（平台万位）",
    "qian": "第2位双码（平台千位）",
    "bai": "第3位双码（平台百位）",
    "shi": "第4位双码（平台十位）"
  };
  var CORE_KEYS = ["position.wan.main", "position.qian.main", "position.bai.main", "position.shi.main",
    "wan", "qian", "bai", "shi", "positionTotal", "threeDuishu", "sixPeiSix", "fivePeiFive", "totalHewei",
    "threeFour", "wanQianBai", "qianBaiShi", "wanQianBaiShi"];
  var FILTER_KEYS = ["sumAvoid", "sumRangeAvoid", "spanAvoid", "repeatAvoid", "consecutiveAvoid",
    "parityRatioAvoid", "sizeRatioAvoid", "threeDigitAvoid", "threeDigitAvoid2", "twoDigitAvoid",
    "twoDigitAvoid2", "twoDigitAvoid3", "twoDigitHit", "anyTwoHeweiHit", "anyThreeHeweiHit", "threeDigitHit"];
  var RETIRED_MODELS = ["brotherNumberFramework", "compactAttack", "threeDingOne", "threeDingTwo"];
  var DOUBLE_DISPLAY_MODELS = ["threeDuishu", "sixPeiSix", "fivePeiFive"];
  var SAMPLE_MIN = 200;

  // CORE_SNAP_KEYS 用于 localStorage 日账快照：标签/基线同步为中性口径与精确基线。
  var CORE_SNAP_KEYS = [
    ["wanMain", "第1位单定（平台万位）", 90],
    ["qianMain", "第2位单定（平台千位）", 90],
    ["baiMain", "第3位单定（平台百位）", 90],
    ["shiMain", "第4位单定（平台十位）", 90],
    ["wan", "第1位双码（平台万位）", 80],
    ["qian", "第2位双码（平台千位）", 80],
    ["bai", "第3位双码（平台百位）", 80],
    ["shi", "第4位双码（平台十位）", 80],
    ["positionTotal", "定位双码总击(4位合取)", 40.96],
    ["threeDuishu", "三对数", 90.26],
    ["sixPeiSix", "六配六", 93.76],
    ["fivePeiFive", "五配五四定", 87.02],
    ["totalHewei", "总合尾", 90],
    ["threeFour", "三合尾避开", 72.90],
    ["wanQianBai", "千百十合尾", 90],
    ["qianBaiShi", "百十个合尾", 90],
    ["wanQianBaiShi", "千百十个合尾", 90]
  ];

  // UTC+8 minus the 05:00 reset, never the browser's local timezone.
  function businessDay(now){
    return new Date((now==null?Date.now():Number(now))+3*3600000).toISOString().slice(0,10);
  }

  function stateBusinessDay(state){
    var dates=[state.positionDayScope,state.businessDay,state.businessDate].filter(function(x){return x!=null&&x!=="";});
    return dates.length&&dates.every(function(x){return /^\d{4}-\d{2}-\d{2}$/.test(String(x))&&String(x)===String(dates[0]);})?String(dates[0]):"";
  }

  function verifiedCounts(item){
    if(!item||typeof item!=="object")return null;
    var total=item.total,hit=item.hit!=null?item.hit:item.match;
    if(!Number.isSafeInteger(total)||total<0||!Number.isSafeInteger(hit)||hit<0||hit>total)return null;
    return {total:total,hit:hit,rate:total?hit*100/total:null,label:item.label||""};
  }

  function dailyDetail(state,key){
    var day=businessDay();
    var raw=(state.rateDetails||{})[key];
    var counter=(state.counters||{})[key];
    var scoped=raw&&String(raw.dayScope||raw.businessDay||"")===day?raw:
      counter&&String(counter.dayScope||counter.businessDay||"")===day?counter:null;
    var counts=stateBusinessDay(state)===day?verifiedCounts(scoped):null;
    return counts||{rate:null,total:0,hit:0,label:(raw&&raw.label)||(counter&&counter.label)||key};
  }

  function dailyLedger(state,model,day){
    var raw=((state.dailyStreakLedger||{})[model]||{})[day];
    // The enclosing key is the server's accounting date; reject a conflicting row.
    if(!raw||(raw.day&&String(raw.day)!==day))return null;
    if(day===businessDay()&&stateBusinessDay(state)!==day)return null;
    var counts=verifiedCounts(raw);
    return counts?Object.assign({},raw,counts):null;
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
    });
  }

  function num(v){
    if (v == null || v === "") return null;
    if (typeof v === "number") return Number.isFinite(v) ? v : null;
    var m = String(v).match(/-?\d+(?:\.\d+)?/);
    return m ? Number(m[0]) : null;
  }

  function rateClass(rate, baseline){
    if (rate == null || baseline == null) return "";
    if (rate >= baseline + 2) return "ok";
    if (rate < baseline) return "bad";
    return "warn";
  }

  function fmtRate(rate){
    if (rate == null) return "—";
    return Number(rate).toFixed(2).replace(/\.00$/, "") + "%";
  }

  function fmtBaseline(v){
    if (v == null || !Number.isFinite(Number(v))) return "—";
    return Number(v).toFixed(2).replace(/\.00$/, "");
  }

  function baselineFor(state, key){
    var src=(state && state.rateDetails && state.rateDetails[key]) || {};
    var api=num(src.randomBaseline);
    var exact=EXACT_BASELINES[key];
    if(api!=null){
      if(exact!=null && Math.abs(api-exact)>0.005) return {value:exact, star:true, api:api};
      return {value:api, star:false, api:null};
    }
    if(exact!=null) return {value:exact, star:true, api:null};
    return {value:null, star:false, api:null};
  }

  function baselineFootnote(which){
    if(which==="filters"){
      var parts=[];
      Object.keys(IFACE_BASELINE_ORIGINAL).forEach(function(k){parts.push(k+" 接口原值 "+IFACE_BASELINE_ORIGINAL[k]+"%");});
      return "* 为 10^4 精确枚举校正值，接口原值：" + parts.join("、") + "；其余 * 项接口无随机基线。未标 * 为 /state rateDetails.randomBaseline 原值。";
    }
    return "* 为 10^4 精确枚举/理论校正值，接口原值：核心这 9 项接口无随机基线（positionTotal=4 双码合取 0.8^4、threeDuishu=对子共现、sixPeiSix/fivePeiFive=代码理论值、threeFour=三合尾 72.90、总合尾/3 条合尾=杀 1 尾码）。未标 * 为 /state rateDetails.randomBaseline 原值。";
  }

  function todayVerifiedCount(state){
    var d=dailyDetail(state,"positionTotal");
    return d.total||0;
  }

  function row(label, rate, total, baseline, note, starred){
    var cls = rateClass(rate, baseline);
    var baseTxt = baseline == null ? "—" : ("基线 ~" + fmtBaseline(baseline) + "%" + (starred ? "*" : ""));
    var parts=[];
    if(note) parts.push(note);
    if(total != null && total < SAMPLE_MIN) parts.push("样本不足(n<200)");
    var fullNote=parts.join(" · ");
    return "<tr>"
      + "<td>" + esc(label) + (fullNote ? "<div class=\"muted\" style=\"font-size:11px;margin-top:3px\">" + esc(fullNote) + "</div>" : "") + "</td>"
      + "<td class=\"rate " + cls + "\">" + esc(fmtRate(rate)) + "</td>"
      + "<td class=\"hide-sm\">" + esc(total == null ? "—" : String(total)) + "</td>"
      + "<td class=\"muted hide-sm\">" + esc(baseTxt) + "</td>"
      + "</tr>";
  }

  function section(title, note, rowsHtml, extraTop){
    return "<section><h2><span>" + esc(title) + "</span></h2>"
      + (extraTop || "")
      + (note ? "<div class=\"note\">" + esc(note) + "</div>" : "")
      + "<div class=\"scroll\"><table><thead><tr><th>项目</th><th>命中率</th><th class=\"hide-sm\">样本</th><th class=\"hide-sm\">对照</th></tr></thead>"
      + "<tbody>" + (rowsHtml || "<tr><td colspan=\"4\" class=\"empty\">无数据</td></tr>") + "</tbody></table></div></section>";
  }

  function detail(rateDetails, key){
    var d = rateDetails && rateDetails[key];
    if (!d) return { rate: null, total: null, label: key, hit: null };
    return {
      rate: num(d.rate),
      total: d.total,
      hit: d.hit != null ? d.hit : d.match,
      label: d.label || key
    };
  }

  function loadDiary(){
    try{
      var raw = localStorage.getItem(DIARY_KEY);
      var obj = raw ? JSON.parse(raw) : {};
      return obj && typeof obj === "object" ? obj : {};
    }catch(_){ return {}; }
  }

  function saveDiary(diary){
    try{
      var days = Object.keys(diary).sort();
      while (days.length > DIARY_KEEP_DAYS) {
        delete diary[days.shift()];
      }
      localStorage.setItem(DIARY_KEY, JSON.stringify(diary));
    }catch(_){}
  }

  function recordDailySnapshot(state){
    var day=businessDay();
    if(stateBusinessDay(state)!==day)return;
    var items={};
    CORE_SNAP_KEYS.forEach(function(pair){
      var mapping={wanMain:"position.wan.main",qianMain:"position.qian.main",baiMain:"position.bai.main",shiMain:"position.shi.main"};
      var d=dailyDetail(state,mapping[pair[0]]||pair[0]);
      items[pair[0]]={label:pair[1],rate:d.rate,total:d.total,hit:d.hit,baseline:pair[2],source:"backend-business-day"};
    });
    Object.keys(MODEL_LABELS).forEach(function(model){
      var d=dailyLedger(state,model,day);
      if(d)items["ledger."+model]={label:MODEL_LABELS[model],rate:d.rate,total:d.total,hit:d.hit,source:"backend-business-day"};
    });
    var diary=loadDiary();
    diary[day]={day:day,dayResetHour:5,verifiedBusinessDay:true,
      updatedAt:state.updatedAt||new Date().toISOString(),latestPeriod:(state.latestRecord||{}).period||"",items:items};
    saveDiary(diary);
  }

  function allDays(state){
    var set = {};
    var diary = loadDiary();
    Object.keys(diary).forEach(function(d){ set[d] = true; });
    var ledger = (state && state.dailyStreakLedger) || {};
    Object.keys(ledger).forEach(function(model){
      Object.keys(ledger[model] || {}).forEach(function(d){
        if (d && d.indexOf("2099") !== 0) set[d] = true;
      });
    });
    set[businessDay()]=true;
    return Object.keys(set).filter(function(d){return /^\d{4}-\d{2}-\d{2}$/.test(d);}).sort().reverse();
  }

  function buildDaySelector(days, current){
    var opts = days.map(function(d){
      return "<option value=\"" + esc(d) + "\"" + (d === current ? " selected" : "") + ">" + esc(d) + "</option>";
    }).join("");
    return "<div class=\"day-bar\">"
      + "<label for=\"daySelect\">业务日</label>"
      + "<select id=\"daySelect\">" + opts + "</select>"
      + "<span class=\"chip\">按日百分比记 · 本地保留 " + DIARY_KEEP_DAYS + " 天</span>"
      + "</div>";
  }

  function renderDailySection(state,day){
    var diary=loadDiary(),snap=diary[day],rows="";
    if(snap&&snap.verifiedBusinessDay===true&&snap.items){
      Object.keys(snap.items).forEach(function(key){
        if(key.indexOf("ledger.")===0)return;
        var item=snap.items[key];
        if(item.source!=="backend-business-day")return;
        var counts=verifiedCounts(item);
        if(counts)rows+=row(item.label||key,counts.rate,counts.total,item.baseline,
          "命中 "+counts.hit+"/"+counts.total+" · 北京时间05:00起 · 记于 "+(snap.updatedAt||""));
      });
    }
    Object.keys(MODEL_LABELS).forEach(function(model){
      var d=dailyLedger(state,model,day);
      if(d)rows+=row(MODEL_LABELS[model]+"（日账）",d.rate,d.total,null,"后端本业务日已核验实绩 · 命中 "+d.hit+"/"+d.total);
      else if(snap&&snap.verifiedBusinessDay===true&&snap.items){
        var saved=snap.items["ledger."+model];
        var counts=saved&&saved.source==="backend-business-day"?verifiedCounts(saved):null;
        if(counts)rows+=row(MODEL_LABELS[model]+"（归档）",counts.rate,counts.total,null,"已验证日账档案");
      }
    });
    if(!rows)rows='<tr><td colspan="4" class="empty">该日暂无已验证日账；旧版未证明统计口径的档案仅保留导出。</td></tr>';
    return section("按日百分比记 · "+day,
      "北京时间05:00统一清零，仅开奖前发布且开奖后核验的本业务日记录；不以历史回放补造实战命中率。历史档案仅存本浏览器 localStorage，服务端只提供当日投影。",
      rows,buildDaySelector(allDays(state),day));
  }

  function render(state){
    lastState=state;
    var today=businessDay();
    displayedBusinessDay=today;
    var current=stateBusinessDay(state)===today;
    if(!explicitHistoryDay)selectedDay=today;
    var day=selectedDay||today;
    if(current)recordDailySnapshot(state);
    var latest=state.latestRecord||{},storm=state.stormMode||{};
    var meta=[];
    meta.push('<span class="chip">期号 '+esc(latest.period||"—")+'</span>');
    if(Array.isArray(latest.numbers)&&latest.numbers.length)meta.push('<span class="chip">开奖 '+esc(latest.numbers.join(" "))+'</span>');
    meta.push('<span class="chip '+(current?"ok":"warn")+'">业务日 '+esc(today)+' · 北京时间05:00起</span>');
    meta.push('<span class="chip '+(state.tipReady?"ok":"bad")+'">tipReady '+(state.tipReady?"是":"否")+'</span>');
    meta.push('<span class="chip '+(storm.active?"warn":"ok")+'">风暴 '+(storm.active?"开":"关")+'</span>');
    document.getElementById("meta").innerHTML=meta.join("");
    var sampleN=todayVerifiedCount(state);
    var sampleTxt="当前业务日已验证 "+sampleN+" 期；<200 时全部按样本不足处理，只作波动参考。";
    var core="";
    CORE_KEYS.forEach(function(key){
      var d=dailyDetail(state,key);
      var b=baselineFor(state,key);
      var label=POSITION_LABELS[key]||d.label||MODEL_LABELS[key]||key;
      core+=row(label,d.rate,d.total,b.value,d.total?"本业务日已核验 · 命中 "+d.hit+"/"+d.total:"暂无今日已验证数据",b.star);
    });
    var attack="";
    Object.keys(MODEL_LABELS).forEach(function(key){
      if(RETIRED_MODELS.indexOf(key)>=0)return;
      var d=dailyLedger(state,key,today);
      if(!d)return;
      attack+=row(MODEL_LABELS[key],d.rate,d.total,null,"本业务日已核验 · 命中 "+d.hit+"/"+d.total);
    });
    if(!attack)attack='<tr><td colspan="4" class="empty">当前业务日暂无策略模型已验证数据。</td></tr>';
    var filters="";
    FILTER_KEYS.forEach(function(key){
      var d=dailyDetail(state,key);
      var b=baselineFor(state,key);
      filters+=row(d.label||key,d.rate,d.total,b.value,d.total?"本业务日已核验 · 命中 "+d.hit+"/"+d.total:"暂无今日已验证数据",b.star);
    });
    var issues=((state.modelWatchdog||{}).lastIssues||[]).map(function(it){
      return row((it.label||it.key||"issue")+" · "+(it.action||""),null,null,null,"运维告警，非今日实战命中统计");
    }).join("");
    if(!issues)issues='<tr><td colspan="4" class="empty">当前无 watchdog 告警</td></tr>';
    var coreNote="平台官方球序为万/千/百/十/个位（第5球不参与本模型）；历史标签『千位/万位』均指第1位，本页统一为「第N位+平台位名」。"+sampleTxt+baselineFootnote("core");
    var attackExtra='<div class="note">与今日核心为同一评估的双重展示，不是两套模型：'+DOUBLE_DISPLAY_MODELS.map(function(k){return MODEL_LABELS[k]||k;}).join("、")+'。</div>';
    var attackNote="整组随机基线需按各自规则精确枚举，本页不硬编码，勿在无对照下解读。"+sampleTxt;
    var filterNote="高基线通过率不等于预测能力。"+sampleTxt+baselineFootnote("filters");
    document.getElementById("sections").innerHTML=renderDailySection(state,day)+
      section("今日核心（业务日）",current?coreNote:"北京时间05:00已清零，等待服务端本周期数据。"+sampleTxt,core)+
      section("今日进攻 / 推荐",attackNote,attack,attackExtra)+
      section("今日过滤与参考项",filterNote,filters)+
      section("Watchdog 告警","只读运维状态。",issues);
    var sel=document.getElementById("daySelect");
    if(sel)sel.onchange=function(){selectedDay=sel.value;explicitHistoryDay=selectedDay!==businessDay();render(lastState);};
  }

  function checkBusinessDay(){
    if(lastState&&displayedBusinessDay!==businessDay()){
      render(lastState);
      var status=document.getElementById("status");
      status.className="status";
      status.textContent="北京时间05:00已清零，等待本周期已验证数据。";
    }
  }

  function exportDiary(){
    var payload = {
      exportedAt: new Date().toISOString(),
      diary: loadDiary(),
      ledger: lastState && lastState.dailyStreakLedger || null,
      positionDayScope: lastState && lastState.positionDayScope || null
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "penta5-accuracy-daily-" + (selectedDay || "export") + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  async function load(){
    var status = document.getElementById("status");
    var btn = document.getElementById("refreshBtn");
    btn.disabled = true;
    status.className = "status";
    status.textContent = "拉取 /state …";
    try{
      var res = await fetch("/state", { credentials: "same-origin", cache: "no-store" });
      if (res.status === 401) {
        location.replace("/login?next=" + encodeURIComponent("/accuracy"));
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      var state = await res.json();
      render(state);
      status.textContent = stateBusinessDay(state)===businessDay()
        ? "已刷新 · 自动 " + (AUTO_MS / 1000) + "s · 本业务日已验证日账"
        : "北京时间05:00已清零，等待服务端本周期数据。";
    } catch (err) {
      status.className = "status err";
      status.textContent = "加载失败：" + (err && err.message ? err.message : String(err));
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", load);
  document.getElementById("exportBtn").addEventListener("click", exportDiary);
  load();
  timer = setInterval(load, AUTO_MS);
  setInterval(checkBusinessDay,1000);
  window.addEventListener("pageshow",checkBusinessDay);
  document.addEventListener("visibilitychange",checkBusinessDay);
})();
  </script>
</body>
</html>
