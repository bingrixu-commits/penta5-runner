<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="攻击语转">
  <link rel="manifest" href="/attack-txt-manifest.json">
  <link rel="apple-touch-icon" href="/attack-txt-icon.svg">
  <link rel="icon" href="/attack-txt-icon.svg" type="image/svg+xml">
  <title>攻击语转TXT</title>
  <style>
    :root{
      --bg:#0f172a;--card:#111827;--ink:#f8fafc;--muted:#94a3b8;--line:#334155;
      --blue:#2563eb;--green:#059669;--orange:#ea580c;--slate:#334155;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#0b1220 0%,var(--bg) 55%,#111827 100%);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:16px 14px calc(24px + env(safe-area-inset-bottom));}
    .wrap{max-width:720px;margin:0 auto}
    .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{margin:0;font-size:22px;font-weight:900}
    .sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.55}
    .link{color:#93c5fd;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
    .card{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
    label{display:block;font-size:14px;font-weight:800;margin:0 0 8px}
    textarea{
      width:100%;min-height:140px;resize:vertical;border:1px solid #475569;border-radius:12px;
      background:#0b1220;color:var(--ink);padding:12px;font-size:15px;line-height:1.5;outline:none;
    }
    textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(37,99,235,.25)}
    .sec{margin-top:12px;padding-top:10px;border-top:1px dashed #334155}
    .sec-title{font-size:13px;font-weight:900;color:#fdba74;margin:0 0 8px}
    .target-row{display:grid;grid-template-columns:minmax(0,1fr) 128px;align-items:center;gap:10px;margin:0 0 10px}
    .target-row label{margin:0}
    .target-row input{
      width:100%;height:42px;border:1px solid #475569;border-radius:8px;background:#0b1220;color:var(--ink);
      padding:0 10px;font-size:18px;font-weight:900;text-align:center;outline:none;
    }
    .target-row input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(37,99,235,.25)}
    .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btns .span2{grid-column:1 / -1}
    .toolbar{
      display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;
    }
    .toolbar button{flex:1 1 calc(50% - 4px);min-width:140px}
    @media (min-width:560px){
      .toolbar button{flex:1 1 auto;min-width:0}
    }
    .pager{
      display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;
      color:#cbd5e1;font-size:12px;font-weight:800;line-height:1.5;
    }
    .pager .nav{display:flex;gap:8px;margin-left:auto}
    .pager button{padding:8px 12px;font-size:13px}
    button{
      border:0;border-radius:11px;padding:12px 10px;font-size:14px;font-weight:900;cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    button:disabled{opacity:.5;cursor:default}
    button.orange{background:var(--orange);color:#fff}
    button.primary{background:var(--blue);color:#fff}
    button.green{background:var(--green);color:#fff}
    button.secondary{background:#1e293b;color:#e2e8f0;border:1px solid #475569}
    .status{margin-top:12px;padding:10px 12px;border-radius:10px;background:#1e293b;color:#cbd5e1;font-size:13px;line-height:1.5;font-weight:700;word-break:break-word}
    .status.ok{background:rgba(5,150,105,.18);color:#6ee7b7}
    .status.err{background:rgba(220,38,38,.18);color:#fca5a5}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .chip{background:#0b1220;border:1px solid #334155;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:#e2e8f0}
    .preview{
      width:100%;min-height:110px;max-height:36vh;resize:vertical;border:1px solid #334155;border-radius:12px;
      background:#020617;color:#e2e8f0;padding:12px;font-size:13px;line-height:1.45;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    .hint{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.6}
    .install{margin-top:12px;padding:12px;border-radius:12px;border:1px dashed #475569;background:rgba(37,99,235,.08);color:#cbd5e1;font-size:12px;line-height:1.6}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>三定/四定转TXT</h1>
        <div class="sub">三定四种：千百十 / 百十个 / 千十个(万十个) / 千百个，空位为 x；回删只扫阿里云最近 200 期真实旧码；达到规定组数立即停止并封存在服务器。</div>
      </div>
      <a class="link" href="/panel">回面板</a>
    </div>

    <div class="card">
      <div class="toolbar" id="quickToolbar">
        <button type="button" class="secondary" id="btnPaste">读取剪贴板</button>
        <button type="button" class="secondary" id="btnClear">清空</button>
        <button type="button" class="secondary" id="btnSyncPanelDuishu">同步面板本期对数</button>
        <button type="button" class="secondary" id="btnPreviewCount">预览组数</button>
        <button type="button" class="green" id="btnDownload" disabled>确认生成TXT</button>
        <button type="button" class="orange" id="btnCopyPart1" disabled>复制第1段(≤300)</button>
        <button type="button" class="orange" id="btnCopyPart2" disabled>复制第2段(剩余)</button>
        <button type="button" class="secondary" id="btnCopyAll" disabled>复制全部(备用)</button>
        <button type="button" class="secondary" id="btnCopyPage" disabled>复制本页（仅预览）</button>
      </div>

      <label for="attackInput">攻击语</label>
      <textarea id="attackInput" placeholder="粘贴三定/四定攻击语。对数只认面板「开奖号码」下「三对数排除 → 本期排除」；点「同步面板本期对数」或转换前自动对齐。&#10;示例：百012345689十1234567890个0123456789三定百十个合012345789二数合0468除对数49各" autofocus></textarea>

      <div class="sec">
        <div class="sec-title">三定四种格式 · 回删只扫阿里 RDS 最近 200 期</div>
        <div class="target-row">
          <label for="targetRemain">回删后剩余组数</label>
          <input id="targetRemain" type="number" inputmode="numeric" min="1" max="1000" step="1" value="800">
        </div>
        <div class="btns">
          <button type="button" class="orange span2" id="btnThreeBackDelete">三定生成并回删</button>
          <button type="button" class="primary span2" id="btnConvert">四定转换</button>
        </div>
      </div>

      <div class="status" id="status">正在读取服务器封存结果…</div>
      <div class="meta" id="meta" hidden></div>

      <div class="pager" id="pager" hidden>
        <span id="pagerInfo">完整计算结果（仅供核对，尚未生成TXT）</span>
        <div class="nav">
          <button type="button" class="secondary" id="btnPrevPage" disabled>上一页</button>
          <button type="button" class="secondary" id="btnNextPage" disabled>下一页</button>
        </div>
      </div>

      <div style="margin-top:12px">
        <label for="preview">本页预览</label>
        <textarea id="preview" class="preview" readonly placeholder="例：103x / x346 / 1x03 / 10x3，…各"></textarea>
      </div>

      <div class="btns" style="margin-top:10px">
        <button type="button" class="green" id="btnOneClickCopy" disabled>一键复制第1段(≤300)</button>
        <button type="button" class="primary" id="btnOneClickCopy2" disabled>接着复制第2段</button>
      </div>

      <div class="hint">投注端一次顶多约 300 组：先复制第1段，粘贴完再复制第2段（剩余）。确认生成TXT=下载完整文件（无截断）。复制本页仅预览。封存结果保存在阿里服务器，关闭电脑后再次打开仍读取同一份结果。</div>
      <div class="install">添加到主屏幕：Safari/Chrome 菜单 →「添加到主屏幕」。</div>
    </div>
  </div>

  <script src="/txt_attack_convert.js?v=20260724-sealed-target-v1"></script>
  <script>
(function(){
  var PAGE_SIZE=250;
  var ATTACK_COPY_CHUNK=300;
  var STORE_KEY="penta5AttackTxtPageV2";
  var STORE_VERSION=3;
  var LEGACY_STORE_KEYS=["penta5AttackTxtPageV1"];
  var HISTORY_KEY="penta5AttackTxtHistoryV1";
  var HISTORY_TTL_MS=30*60*1000;
  var input=document.getElementById("attackInput");
  var preview=document.getElementById("preview");
  var statusEl=document.getElementById("status");
  var meta=document.getElementById("meta");
  var pager=document.getElementById("pager");
  var pagerInfo=document.getElementById("pagerInfo");
  var btnPaste=document.getElementById("btnPaste");
  var btnClear=document.getElementById("btnClear");
  var btnSyncPanelDuishu=document.getElementById("btnSyncPanelDuishu");
  var btnPreviewCount=document.getElementById("btnPreviewCount");
  var btnThree=document.getElementById("btnThreeBackDelete");
  var btnConvert=document.getElementById("btnConvert");
  var btnCopyPage=document.getElementById("btnCopyPage");
  var btnCopyAll=document.getElementById("btnCopyAll");
  var btnCopyPart1=document.getElementById("btnCopyPart1");
  var btnCopyPart2=document.getElementById("btnCopyPart2");
  var btnOneClickCopy=document.getElementById("btnOneClickCopy");
  var btnOneClickCopy2=document.getElementById("btnOneClickCopy2");
  var btnDownload=document.getElementById("btnDownload");
  var targetRemain=document.getElementById("targetRemain");
  var btnPrevPage=document.getElementById("btnPrevPage");
  var btnNextPage=document.getElementById("btnNextPage");
  var lastResult=null;
  var pageIndex=0;
  var multiActiveIndex=0;
  var txtGenerated=false;
  var lastMode="";
  var saveTimer=null;
  var api=window.Penta5AttackTxtConvert;
  var cachedPanelDuishuPair="";
  var currentSnapshot=null;

  function setStatus(text,kind){
    statusEl.textContent=String(text||"");
    statusEl.className="status"+(kind==="ok"?" ok":kind==="err"?" err":"");
  }
  /** 只取开奖号码下「三对数排除 → 本期排除」，不取框架自选对数 */
  function fetchPanelThreeDuishuPair(){
    return fetch("/state",{credentials:"same-origin",cache:"no-store"}).then(function(res){
      if(!res.ok)throw new Error("面板状态 HTTP "+res.status);
      return res.json();
    }).then(function(data){
      var snap=data&&data.currentPrediction&&data.currentPrediction.threeDuishu;
      var rec=data&&data.threeDuishuRecommendation;
      var pair=String((snap&&snap.selectedPair)||(rec&&rec.selectedPair)||"").replace(/\D/g,"").slice(0,2);
      if(!/^\d{2}$/.test(pair))throw new Error("面板本期对数尚未就绪（开奖号码下「三对数排除」）");
      cachedPanelDuishuPair=pair;
      return pair;
    });
  }
  function applyPanelDuishuToInput(pair){
    if(!input||!api||typeof api.applyPanelThreeDuishuPair!=="function")return "";
    var next=api.applyPanelThreeDuishuPair(input.value||"",pair);
    input.value=next;
    return next;
  }
  function ensurePanelDuishuBeforeConvert(){
    return fetchPanelThreeDuishuPair().then(function(pair){
      applyPanelDuishuToInput(pair);
      return pair;
    });
  }
  // 浏览器不保存回删结果；唯一持久结果来自阿里服务器封存文件。
  function schedulePersist(){}
  function clearLegacyPageSnapshots(){
    // 只清理旧版曾写入的本应用缓存；新版不再写入任何浏览器存储。
    try{
      [STORE_KEY,HISTORY_KEY].concat(LEGACY_STORE_KEYS).forEach(function(key){
        localStorage.removeItem(key);
      });
    }catch(e){}
  }
  function isSealedTargetGroup(result,target){
    if(!result||!result.ok||result.source!=="three-ding-backdelete-target"||!Array.isArray(result.tokens))return false;
    var afterFilter=Number(result.afterFilter);
    var count=Number(result.count);
    var deleted=Number(result.deletedUnique||0);
    target=Number(target);
    if(!isFinite(afterFilter)||afterFilter<=0||!isFinite(target)||target<1)return false;
    if(count!==target||Number(result.targetRemain)!==target||result.tokens.length!==count)return false;
    if(deleted!==afterFilter-target)return false;
    return new Set(result.tokens).size===result.tokens.length;
  }
  function isRestorableResult(result,mode,target){
    if(!result||!result.ok)return false;
    if(String(mode||"")!=="three")return true;
    if(result.multiCombo===true){
      return result.source==="three-ding-backdelete-multi-combo"&&
        Array.isArray(result.groups)&&result.groups.length>0&&
        result.groups.every(function(group){return isSealedTargetGroup(group,target);});
    }
    return isSealedTargetGroup(result,target);
  }
  function applySealedSnapshot(snapshot,restored){
    var target=Number(snapshot&&snapshot.targetRemain);
    var result=snapshot&&snapshot.result;
    if(!snapshot||!/^[a-f0-9]{64}$/.test(String(snapshot.fingerprint||""))||!isRestorableResult(result,"three",target)){
      throw new Error("服务器封存结果校验失败，已拒绝显示。");
    }
    currentSnapshot=snapshot;
    lastMode="three";
    if(input)input.value=String(snapshot.normalizedAttackText||"");
    if(targetRemain)targetRemain.value=String(target);
    cachedPanelDuishuPair=String(snapshot.panelThreeDuishuPair||"");
    result.sealedFingerprint=String(snapshot.fingerprint||"");
    result.sealedPeriod=String(snapshot.historyLatestPeriod||"");
    result.sealedTargetPeriod=String(snapshot.panelTargetPeriod||"");
    result.sealedPair=String(snapshot.panelThreeDuishuPair||"");
    result.sealedAt=String(snapshot.createdAt||"");
    applyResult(result);
    setStatus(
      (restored?"已恢复服务器封存结果":"已生成并封存到服务器")+
      "：RDS "+result.sealedPeriod+" 期｜目标 "+target+" 组｜封存 "+result.sealedFingerprint.slice(0,12)+"。关闭电脑后再次打开仍是这份结果。",
      "ok"
    );
  }
  function restorePage(){
    clearLegacyPageSnapshots();
    return fetch("/backdelete-state",{credentials:"same-origin",cache:"no-store"})
      .then(function(res){
        return res.json().catch(function(){return null;}).then(function(data){
          if(!res.ok||!data||data.ok===false)throw new Error(String(data&&data.error||("HTTP "+res.status)));
          return data;
        });
      })
      .then(function(data){
        if(data.snapshot){
          applySealedSnapshot(data.snapshot,true);
          return true;
        }
        setStatus("尚无服务器封存结果。粘贴攻击语、填写剩余组数后点「三定生成并回删」。");
        return false;
      })
      .catch(function(error){
        setStatus("读取服务器封存结果失败："+String(error&&error.message||error),"err");
        return false;
      });
  }
  function clearPersisted(){clearLegacyPageSnapshots();}
  function unmaskToken(token){
    if(api&&typeof api.threeDingUnmaskToken==="function")return api.threeDingUnmaskToken(token)||"";
    var t=String(token||"").replace(/各/g,"").trim();
    if(/^\d{3}$/.test(t))return t;
    if(/^\d{3}[xX+]$/.test(t))return t.slice(0,3);
    if(/^[xX+\d]{4}$/.test(t)&&(t.match(/[xX+]/g)||[]).length===1)return t.replace(/[xX+]/g,"");
    var digits=t.replace(/\D/g,"");
    return /^\d{3}$/.test(digits)?digits:t;
  }
  function isMultiComboResult(result){
    return !!(result&&result.multiCombo===true&&Array.isArray(result.groups)&&result.groups.length);
  }
  function activeResultOf(result){
    if(!isMultiComboResult(result))return result;
    if(multiActiveIndex<0||multiActiveIndex>=result.groups.length)multiActiveIndex=0;
    return result.groups[multiActiveIndex]||result.groups[0]||null;
  }
  function activeComboLabel(result){
    var active=activeResultOf(result);
    if(!active)return "";
    return String(active.comboName||active.label||"三定");
  }
  function tokensOf(result){
    result=activeResultOf(result);
    if(!result)return [];
    if(Array.isArray(result.tokens)&&result.tokens.length)return result.tokens.slice();
    var text=String(result.text||"").replace(/各+$/,"").trim();
    if(!text)return [];
    if(text.indexOf(",")>=0){
      return text.split(",").map(function(s){return unmaskToken(s);}).filter(Boolean);
    }
    return text.split(/\s+/).map(function(s){return unmaskToken(s);}).filter(Boolean);
  }
  function pageCountOf(result){
    var n=tokensOf(result).length;
    return n?Math.ceil(n/PAGE_SIZE):0;
  }
  function pageSlice(result,idx){
    var toks=tokensOf(result);
    var start=idx*PAGE_SIZE;
    return toks.slice(start,start+PAGE_SIZE);
  }
  function pageText(result,idx){
    result=activeResultOf(result);
    var slice=pageSlice(result,idx);
    if(!slice.length)return "";
    var allThree=slice.every(function(t){return /^\d{3}$/.test(String(t));});
    if(allThree&&api&&typeof api.formatThreeDingGeList==="function"){
      var combo=null;
      if(result&&result.comboName)combo={name:result.comboName,blankIndex:result.blankIndex,positions:result.positions};
      else if(result&&result.blankIndex!=null)combo=result.blankIndex;
      return api.formatThreeDingGeList(slice,null,combo);
    }
    return slice.map(function(t){return String(t);}).join(",")+"各";
  }
  function setMeta(result){
    if(!result||!result.ok){meta.hidden=true;meta.innerHTML="";return;}
    meta.hidden=false;
    var chips=[
      '<span class="chip">'+(result.label||"TXT")+'</span>',
      '<span class="chip">'+String(result.count||0)+' 组</span>',
      '<span class="chip">每页 '+PAGE_SIZE+'</span>'
    ];
    if(result.comboName)chips.push('<span class="chip">'+String(result.comboName)+'三定</span>');
    if(result.blankIndex!=null)chips.push('<span class="chip">空位 x</span>');
    if(result.afterFilter!=null)chips.push('<span class="chip">排除后 '+result.afterFilter+'</span>');
    if(result.targetRemain!=null)chips.push('<span class="chip">目标剩 '+result.targetRemain+'</span>');
    if(result.deletedUnique!=null)chips.push('<span class="chip">已删旧码 '+result.deletedUnique+'</span>');
    if(result.scanned!=null)chips.push('<span class="chip">扫 '+result.scanned+' 期</span>');
    if(result.sealedPeriod)chips.push('<span class="chip">RDS '+String(result.sealedPeriod)+'</span>');
    if(result.sealedTargetPeriod)chips.push('<span class="chip">面板目标期 '+String(result.sealedTargetPeriod)+'</span>');
    if(result.sealedPair)chips.push('<span class="chip">面板对数 '+String(result.sealedPair)+'</span>');
    if(result.sealedFingerprint)chips.push('<span class="chip">封存 '+String(result.sealedFingerprint).slice(0,12)+'</span>');
    if(isMultiComboResult(result)){
      var active=activeResultOf(result);
      chips.push('<span class="chip">'+result.groups.length+' 个位置组合</span>');
      chips.push('<span class="chip">当前：'+activeComboLabel(result)+' '+String(active&&active.count||0)+' 组</span>');
      var choices=result.groups.map(function(group,index){
        var selected=index===multiActiveIndex;
        var bg=selected?'#f97316':'#334155';
        return '<button type="button" data-multi-combo-index="'+index+'" style="border:0;border-radius:7px;padding:6px 9px;background:'+bg+';color:white;font-weight:800;cursor:pointer;">'+String(group.comboName||('组合'+(index+1)))+' '+String(group.count||0)+'组</button>';
      }).join('');
      meta.innerHTML=chips.join('')+'<div style="width:100%;margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;"><b style="font-size:12px;">独立组合：</b>'+choices+'</div><div style="width:100%;margin-top:5px;color:var(--muted);font-size:12px;">当前选择的组合可使用上方复制、分页与下载；切换组合不会改变其他组合的回删结果。</div>';
      return;
    }
    meta.innerHTML=chips.join("");
  }
  function renderPager(){
    var active=activeResultOf(lastResult);
    var pages=pageCountOf(lastResult);
    var has=!!(active&&active.ok&&pages>0);
    pager.hidden=!has;
    btnCopyPage.disabled=!has;
    if(btnCopyAll)btnCopyAll.disabled=!has;
    var parts=getCopyParts(lastResult);
    var hasP2=!!(parts&&parts.part2Count>0);
    if(btnCopyPart1)btnCopyPart1.disabled=!has;
    if(btnCopyPart2)btnCopyPart2.disabled=!hasP2;
    if(btnOneClickCopy)btnOneClickCopy.disabled=!has;
    if(btnOneClickCopy2)btnOneClickCopy2.disabled=!hasP2;
    btnDownload.disabled=!has;
    if(!has){
      preview.value="";
      pagerInfo.textContent="完整计算结果（仅供核对，尚未生成TXT）";
      btnPrevPage.disabled=true;
      btnNextPage.disabled=true;
      return;
    }
    if(pageIndex>=pages)pageIndex=pages-1;
    if(pageIndex<0)pageIndex=0;
    var start=pageIndex*PAGE_SIZE+1;
    var end=Math.min((pageIndex+1)*PAGE_SIZE,tokensOf(lastResult).length);
    var checkNote=txtGenerated?"已生成TXT":"仅供核对，尚未生成TXT";
    var comboPrefix=isMultiComboResult(lastResult)
      ?("独立组合 "+(multiActiveIndex+1)+"/"+lastResult.groups.length+"（"+activeComboLabel(lastResult)+"）｜")
      :"";
    pagerInfo.textContent=comboPrefix+"完整计算结果（"+checkNote+"）｜第"+(pageIndex+1)+"/"+pages+"页（第"+start+"–"+end+"组；每页"+PAGE_SIZE+"组）";
    btnPrevPage.disabled=pageIndex<=0;
    btnNextPage.disabled=pageIndex>=pages-1;
    preview.value=pageText(lastResult,pageIndex);
  }
  function setBusy(busy,mode){
    [btnPaste,btnClear,btnPreviewCount,btnThree,btnConvert,btnPrevPage,btnNextPage,targetRemain].forEach(function(b){if(b)b.disabled=!!busy;});
    if(!busy){
      btnThree.textContent="三定生成并回删";
      btnConvert.textContent="四定转换";
      renderPager();
      return;
    }
    btnCopyPage.disabled=true;
    if(btnCopyAll)btnCopyAll.disabled=true;
    if(btnCopyPart1)btnCopyPart1.disabled=true;
    if(btnCopyPart2)btnCopyPart2.disabled=true;
    if(btnOneClickCopy)btnOneClickCopy.disabled=true;
    if(btnOneClickCopy2)btnOneClickCopy2.disabled=true;
    btnDownload.disabled=true;
    if(mode==="three")btnThree.textContent="真实回删中…";
    else if(mode==="four")btnConvert.textContent="转换中…";
  }
  function applyResult(result,opts){
    opts=opts&&typeof opts==="object"?opts:{};
    lastResult=result&&result.ok?result:null;
    if(!opts.keepPage){
      pageIndex=0;
      multiActiveIndex=0;
    }
    if(!opts.keepGenerated)txtGenerated=false;
    if(!result||!result.ok){
      renderPager();
      setMeta(null);
      setStatus((result&&result.message)||"转换失败。","err");
      schedulePersist();
      return;
    }
    setMeta(result);
    renderPager();
    var active=activeResultOf(lastResult);
    var pages=pageCountOf(lastResult);
    var parts=getCopyParts(active);
    var partHint=parts&&parts.part2Count
      ?("投注请分两段：第1段 "+parts.part1Count+" 组 → 第2段 "+parts.part2Count+" 组")
      :("当前组合 "+(active&&active.count||0)+" 组，可一次复制第1段");
    var multiHint=isMultiComboResult(result)
      ?("共 "+result.groups.length+" 个位置组合、合计 "+result.count+" 组；当前为 "+activeComboLabel(result)+"。")
      :("全量 "+result.count+" 组（升序无截断）。");
    setStatus("已转换："+result.label+"，"+multiHint+partHint+"。"+(result.note?" "+result.note:""),"ok");
    schedulePersist();
  }
  function copyText(value,okMsg){
    value=String(value||"");
    if(!value){setStatus("没有可复制内容。","err");return;}
    function done(){setStatus(okMsg||("已复制 "+value.length+" 字。"),"ok");schedulePersist();}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(value).then(done).catch(function(){
        preview.value=value;preview.focus();preview.select();
        try{document.execCommand("copy");done();}catch(e){setStatus("复制失败，请长按预览区手动复制。","err");}
      });
    }else{
      preview.value=value;preview.focus();preview.select();
      try{document.execCommand("copy");done();}catch(e){setStatus("复制失败，请长按预览区手动复制。","err");}
    }
  }
  function doPaste(){
    if(!(navigator.clipboard&&navigator.clipboard.readText)){
      setStatus("当前浏览器不支持读取剪贴板，请长按输入框粘贴。","err");
      return;
    }
    navigator.clipboard.readText().then(function(text){
      input.value=String(text||"");
      setStatus("已读取剪贴板。","ok");
      schedulePersist();
    }).catch(function(){
      setStatus("读取剪贴板失败，请手动粘贴。","err");
    });
  }
  function doClear(){
    input.value="";
    lastResult=null;
    pageIndex=0;
    multiActiveIndex=0;
    txtGenerated=false;
    lastMode="";
    currentSnapshot=null;
    setMeta(null);
    renderPager();
    clearPersisted();
    setStatus("页面已清空；服务器封存结果未删除，刷新页面可重新读取。");
  }
  function doPreviewCount(){
    if(!lastResult||!lastResult.ok){
      setStatus("请先转换，再预览组数。","err");
      return;
    }
    var active=activeResultOf(lastResult);
    var pages=pageCountOf(lastResult);
    var start=pageIndex*PAGE_SIZE+1;
    var end=Math.min((pageIndex+1)*PAGE_SIZE,tokensOf(lastResult).length);
    var prefix=isMultiComboResult(lastResult)?("组合 "+(multiActiveIndex+1)+"/"+lastResult.groups.length+"（"+activeComboLabel(lastResult)+"）｜"):"";
    setStatus(prefix+"共 "+(active&&active.count||0)+" 组｜"+pages+" 页｜当前第"+(pageIndex+1)+"页（第"+start+"–"+end+"组）"+(active&&active.targetRemain!=null?("｜目标剩 "+active.targetRemain):""),"ok");
    schedulePersist();
  }
  function doConvert(){
    if(!api||typeof api.convert!=="function"){setStatus("转换脚本未加载，请刷新。","err");return;}
    lastMode="four";
    setBusy(true,"four");
    setStatus("正在对齐面板本期对数并四定转换…");
    ensurePanelDuishuBeforeConvert().then(function(pair){
      var result=null;
      try{result=api.convert(input.value||"",{panelThreeDuishuPair:pair});}catch(err){result={ok:false,message:String(err&&err.message||err)};}
      applyResult(result);setBusy(false);
      if(result&&result.ok)setStatus((statusEl.textContent||"")+"｜已用面板本期排除 "+pair,"ok");
    }).catch(function(err){
      applyResult({ok:false,message:"同步面板本期对数失败："+String(err&&err.message||err)});
      setBusy(false);
    });
  }
  function doThreeBackDelete(){
    var target=Number(targetRemain&&targetRemain.value);
    if(!Number.isInteger(target)||target<1||target>1000){
      setStatus("回删后剩余组数必须是 1-1000 的整数。","err");
      return;
    }
    if(!String(input&&input.value||"").trim()){
      setStatus("请先粘贴三定攻击语。","err");
      return;
    }
    lastMode="three";
    setBusy(true,"three");
    setStatus("正在由阿里服务器生成，并从最新到最旧回删至 "+target+" 组…");
    ensurePanelDuishuBeforeConvert().then(function(pair){
      return fetch("/backdelete-generate",{
        method:"POST",
        credentials:"same-origin",
        cache:"no-store",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          attackText:String(input.value||""),
          target:target,
          panelThreeDuishuPair:pair
        })
      }).then(function(res){
        return res.json().catch(function(){return null;}).then(function(data){
          if(!res.ok||!data||data.ok===false)throw new Error(String(data&&data.error||("HTTP "+res.status)));
          return data;
        });
      }).then(function(data){
        applySealedSnapshot(data.snapshot,false);
        setBusy(false);
      });
    }).catch(function(err){
      setStatus("生成回删失败："+String(err&&err.message||err),"err");
      setBusy(false);
    });
  }
  function doSyncPanelDuishu(){
    setStatus("正在读取面板「开奖号码」下三对数本期排除…");
    ensurePanelDuishuBeforeConvert().then(function(pair){
      setStatus("已同步面板本期排除 "+pair+"（除对数"+pair+"）","ok");
      schedulePersist();
    }).catch(function(err){
      setStatus("同步失败："+String(err&&err.message||err),"err");
    });
  }
  function resultCombo(result){
    if(!result)return null;
    if(result.comboName)return {name:result.comboName,blankIndex:result.blankIndex,positions:result.positions};
    if(result.blankIndex!=null)return result.blankIndex;
    return null;
  }
  function fullResultText(result){
    result=activeResultOf(result);
    if(!result||!result.ok)return "";
    if(result.text)return String(result.text);
    var toks=tokensOf(result);
    if(!toks.length)return "";
    if(api&&typeof api.formatThreeDingGeList==="function"){
      return api.formatThreeDingGeList(toks,null,resultCombo(result));
    }
    return toks.join(",")+"各";
  }
  function getCopyParts(result){
    result=activeResultOf(result);
    if(!result||!result.ok)return null;
    if(result.copyParts&&result.copyParts.part1Text!=null)return result.copyParts;
    var toks=tokensOf(result);
    if(!toks.length)return null;
    if(api&&typeof api.threeDingCopyParts==="function"){
      var built=api.threeDingCopyParts(toks,ATTACK_COPY_CHUNK,resultCombo(result));
      result.copyParts=built;
      return built;
    }
    var n=Math.min(ATTACK_COPY_CHUNK,toks.length);
    var p1=toks.slice(0,n);
    var p2=toks.slice(n);
    var fmt=function(list){
      if(api&&typeof api.formatThreeDingGeList==="function")return api.formatThreeDingGeList(list,null,resultCombo(result));
      return list.length?list.join(",")+"各":"";
    };
    var built2={
      tokens:toks,
      part1Tokens:p1,
      part2Tokens:p2,
      part1Text:fmt(p1),
      part2Text:fmt(p2),
      part1Count:p1.length,
      part2Count:p2.length,
      total:toks.length
    };
    result.copyParts=built2;
    return built2;
  }
  function doCopyPart(which){
    if(!lastResult||!lastResult.ok){setStatus("请先转换。","err");return;}
    var parts=getCopyParts(lastResult);
    if(!parts){setStatus("没有可分段复制的结果。","err");return;}
    if(which===1){
      if(!parts.part1Count){setStatus("第1段为空。","err");return;}
      var msg1="已复制第1段 "+parts.part1Count+" 组（≤"+ATTACK_COPY_CHUNK+"，逗号+各）。";
      if(parts.part2Count)msg1+="粘贴完后再点「复制第2段」（还有 "+parts.part2Count+" 组）。";
      copyText(parts.part1Text,msg1);
      return;
    }
    if(!parts.part2Count){setStatus("没有第2段（总数未超过 "+ATTACK_COPY_CHUNK+"）。","err");return;}
    copyText(parts.part2Text,"已复制第2段 "+parts.part2Count+" 组（剩余·逗号+各）。两段合计 "+parts.total+" 组。");
  }
  function doCopyAll(){
    if(!lastResult||!lastResult.ok){setStatus("请先转换。","err");return;}
    var active=activeResultOf(lastResult);
    var parts=getCopyParts(active);
    if(parts&&parts.part2Count>0){
      setStatus("投注端一次约 "+ATTACK_COPY_CHUNK+" 组，"+parts.total+" 组请用「复制第1段 / 第2段」，不要一次全贴。","err");
      return;
    }
    var text=fullResultText(active);
    var n=tokensOf(active).length;
    if(!text||!n){setStatus("没有可复制的全量结果。","err");return;}
    if(active.count!=null&&Number(active.count)!==n){
      setStatus("组数不一致：标记 "+active.count+"，实际 "+n+"，已拒绝复制（防截断）。","err");
      return;
    }
    copyText(text,"已复制全部 "+n+" 组（未超 "+ATTACK_COPY_CHUNK+"，可一次粘贴）。");
  }
  function doCopyPage(){
    if(!lastResult||!lastResult.ok){setStatus("请先转换。","err");return;}
    var text=pageText(lastResult,pageIndex);
    var slice=pageSlice(lastResult,pageIndex);
    if(!slice.length){setStatus("本页没有组。","err");return;}
    copyText(text,"已复制本页 "+slice.length+" 组（仅预览）｜第"+(pageIndex+1)+"/"+pageCountOf(lastResult)+"页。投注请用分段复制。");
  }
  function doDownload(){
    if(!lastResult||!api)return;
    try{
      var active=activeResultOf(lastResult);
      if(!active||!active.ok)throw new Error("当前组合结果不存在");
      var name=api.download(active.fileName||"attack.txt",fullResultText(active));
      txtGenerated=true;
      renderPager();
      setStatus("已生成并下载："+name+"（"+activeComboLabel(lastResult)+" "+active.count+" 组）。","ok");
      schedulePersist();
    }catch(err){setStatus("下载失败："+String(err&&err.message||err),"err");}
  }
  function doPrevPage(){
    if(pageIndex<=0)return;
    pageIndex-=1;
    renderPager();
    schedulePersist();
  }
  function doNextPage(){
    if(pageIndex>=pageCountOf(lastResult)-1)return;
    pageIndex+=1;
    renderPager();
    schedulePersist();
  }

  btnPaste.addEventListener("click",doPaste);
  btnClear.addEventListener("click",doClear);
  if(btnSyncPanelDuishu)btnSyncPanelDuishu.addEventListener("click",doSyncPanelDuishu);
  btnPreviewCount.addEventListener("click",doPreviewCount);
  btnThree.addEventListener("click",doThreeBackDelete);
  btnConvert.addEventListener("click",doConvert);
  btnCopyPage.addEventListener("click",doCopyPage);
  if(btnCopyAll)btnCopyAll.addEventListener("click",doCopyAll);
  if(btnCopyPart1)btnCopyPart1.addEventListener("click",function(){doCopyPart(1);});
  if(btnCopyPart2)btnCopyPart2.addEventListener("click",function(){doCopyPart(2);});
  if(btnOneClickCopy)btnOneClickCopy.addEventListener("click",function(){doCopyPart(1);});
  if(btnOneClickCopy2)btnOneClickCopy2.addEventListener("click",function(){doCopyPart(2);});
  btnDownload.addEventListener("click",doDownload);
  btnPrevPage.addEventListener("click",doPrevPage);
  btnNextPage.addEventListener("click",doNextPage);
  if(meta)meta.addEventListener("click",function(event){
    var node=event&&event.target;
    while(node&&node!==meta&&(!node.getAttribute||node.getAttribute("data-multi-combo-index")==null))node=node.parentNode;
    if(!node||node===meta||!lastResult||!isMultiComboResult(lastResult))return;
    var index=Number(node.getAttribute("data-multi-combo-index"));
    if(!isFinite(index)||index<0||index>=lastResult.groups.length)return;
    multiActiveIndex=index;
    pageIndex=0;
    txtGenerated=false;
    setMeta(lastResult);
    renderPager();
    var active=activeResultOf(lastResult);
    setStatus("已切换到 "+activeComboLabel(lastResult)+"："+(active&&active.count||0)+" 组；该组合独立回删，可单独复制或下载。","ok");
    schedulePersist();
  });
  if(input){
    input.addEventListener("input",schedulePersist);
    input.addEventListener("change",schedulePersist);
  }
  restorePage();
})();
  </script>
</body>
</html>
